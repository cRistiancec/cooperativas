name: Actualizar datos SEPS

on:
  # Intenta el día 15 primero. Si la SEPS aún no publicó, reintenta el 18, 20 y 22.
  # El script detecta automáticamente si ya hay datos nuevos y se detiene si no los hay.
  schedule:
    - cron: '0 6 15 * *'   # Día 15 a las 6 AM UTC (intento principal)
    - cron: '0 6 18 * *'   # Día 18 a las 6 AM UTC (1er reintento)
    - cron: '0 6 20 * *'   # Día 20 a las 6 AM UTC (2do reintento)
    - cron: '0 6 22 * *'   # Día 22 a las 6 AM UTC (3er reintento)

  # También permite correrlo manualmente desde GitHub → Actions.
  # Seguro por defecto: una ejecución manual NO publica (no hace commit/push) salvo publicar=true.
  workflow_dispatch:
    inputs:
      forzar_panel:
        description: 'Regenerar panel, validar y probar aunque no haya mes nuevo (usa master_data actual, sin reprocesar)'
        type: boolean
        default: false
      publicar:
        description: 'Hacer commit/push de los resultados (solo si hay cambios reales)'
        type: boolean
        default: false

# Evita ejecuciones solapadas que podrían producir commits duplicados o en conflicto.
concurrency:
  group: actualizar-datos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # Necesario para hacer push de los parquet actualizados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configurar Python
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install "pandas==2.3.0" "pyarrow==23.0.0" "numpy==2.3.1"
          pip install "requests>=2.31.0" "beautifulsoup4>=4.12.0" "openpyxl==3.1.5"

      # 4. Descargar datos nuevos de la SEPS
      - name: Descargar datos de la SEPS
        id: descarga
        run: |
          FECHA_ANTERIOR=$(python -c 'import json; print(json.load(open("master_data/metadata.json"))["fecha_max"])')
          echo "fecha_anterior=${FECHA_ANTERIOR}" >> "$GITHUB_OUTPUT"

          set +e
          python scripts/descargar_datos_seps.py
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "datos_nuevos=true" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "datos_nuevos=false" >> "$GITHUB_OUTPUT"
            echo "La fuente todavía no contiene un mes nuevo. Nada que publicar."
          else
            echo "La descarga o validación falló con código ${EXIT_CODE}."
            exit "$EXIT_CODE"
          fi

      # 6. Ejecutar pipeline ETL completo (solo si hubo descarga exitosa)
      - name: Procesar Balance General
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: python scripts/procesar_balance_cooperativas.py

      # CRÍTICO: el segmento oficial de cada mes (columna SEGMENTO de los archivos
      # SEPS) debe quedar acoplado en master_data/dim_segmento_historico.parquet.
      # Falla si hay meses sin segmento, duplicados o etiquetas inválidas.
      # Segmento point-in-time de los meses sin archivo mensual con SEGMENTO: se toma
      # del registro oficial "Entidades trimestral" del portal SEPS (fuente, sin
      # archivos externos) y se arrastra desde el último corte <= mes.
      - name: Actualizar segmento desde Entidades trimestral (portal SEPS)
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: python scripts/segmento_historico.py --actualizar-entidades

      - name: Verificar segmento histórico acoplado
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: python scripts/segmento_historico.py --verificar

      - name: Generar datos pre-agregados
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: python scripts/generar_agregados.py

      - name: Procesar indicadores raw (base para PyG y CAMEL)
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: python scripts/procesar_indicadores.py

      - name: Procesar PyG
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: python scripts/procesar_pyg.py

      - name: Procesar indicadores CAMEL
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: python scripts/procesar_camel.py

      # Solvencia oficial (PTC/APPR, fichas SEPS 58-63, fuente FS01 / boletín
      # "Patrimonio Técnico"). Cobertura parcial por diseño (Segmento 1/
      # Mutualistas/FINANCOOP) — ver docs/RIESGO_METODOLOGIA.md §3.2. Se marca
      # `continue-on-error: true` (NO `|| true` dentro del run) a propósito:
      # un `|| true` hace que el paso salga en verde sin dejar rastro visible
      # en la UI de Actions; `continue-on-error` deja el paso marcado
      # explícitamente como fallido-pero-no-bloqueante (ícono de advertencia
      # en el resumen del run), que es lo que pide el hardening de esta
      # sesión: "no usar best-effort para ocultar errores críticos" — este
      # SÍ es opcional por diseño, pero su fallo debe verse, no esconderse.
      - name: Procesar Solvencia Oficial (FS01)
        id: solvencia
        if: steps.descarga.outputs.datos_nuevos == 'true'
        continue-on-error: true
        run: python scripts/procesar_solvencia.py

      # Tabla ligera de identidad de entidades (Sección 16): depende de
      # balance.parquet (segmento_historico) y, si existe, de solvencia.parquet
      # (RUC). Mismo criterio que el paso anterior.
      - name: Generar tabla de identidad de entidades
        id: entidades
        if: steps.descarga.outputs.datos_nuevos == 'true'
        continue-on-error: true
        run: python scripts/generar_entidades.py

      # Panel cooperativa-mes S1-S3 + índice de vulnerabilidad que consume Streamlit.
      # Se regenera SOLO si hubo datos nuevos (o si se fuerza manualmente). Un fallo aquí SÍ es bloqueante:
      # no se publica un corte con datos nuevos y panel obsoleto.
      - name: Instalar dependencias del panel y de las pruebas
        id: deps_panel
        if: steps.descarga.outputs.datos_nuevos == 'true' || github.event.inputs.forzar_panel == 'true'
        run: pip install -r requirements.txt

      - name: Regenerar panel de vulnerabilidad (S1-S3)
        id: panel
        if: steps.descarga.outputs.datos_nuevos == 'true' || github.event.inputs.forzar_panel == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/panel"
          python analytics/construir_panel.py . "$RUNNER_TEMP/panel"
          python -m analytics.vulnerabilidad.run_all "$RUNNER_TEMP/panel/panel_cooperativas_S1S3.parquet" reports/vulnerabilidad master_data/panel_vulnerabilidad.parquet
          cp "$RUNNER_TEMP/panel/calidad_panel.json" reports/vulnerabilidad/calidad_panel.json

      - name: Validación estricta de componentes (corte, claves, segmentos)
        id: validacion_estricta
        if: steps.descarga.outputs.datos_nuevos == 'true' || github.event.inputs.forzar_panel == 'true'
        run: python scripts/validar_cierre.py --estricto

      - name: Ejecutar pruebas automatizadas
        id: pruebas
        if: steps.descarga.outputs.datos_nuevos == 'true' || github.event.inputs.forzar_panel == 'true'
        run: python -m unittest discover -s tests -v 2>&1 | tail -40

      - name: Publicar evidencia como artefacto
        if: always() && (steps.descarga.outputs.datos_nuevos == 'true' || github.event.inputs.forzar_panel == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-actualizacion
          path: |
            docs/cierre/validacion_componentes.json
            reports/vulnerabilidad/*.json
            reports/vulnerabilidad/cobertura_segmentos.csv
          retention-days: 30

      # Validación CRÍTICA: si falla, el job debe terminar en FAILED (sin
      # continue-on-error) — nunca se publica un resultado "aparentemente
      # actualizado" si el balance/PyG/CAMEL no pasaron esta validación.
      - name: Validar avance y preservación histórica
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: >-
          python scripts/validar_actualizacion.py
          --fecha-anterior "${{ steps.descarga.outputs.fecha_anterior }}"

      # Resumen explícito de estado por componente, siempre se ejecuta
      # (incluso si un paso crítico anterior falló) para que el run nunca
      # quede sin un registro legible de qué pasó. Distingue exactamente:
      # ERROR CRÍTICO / WARNING (componente opcional degradado) / NO HAY
      # DATOS NUEVOS / COMPONENTE NO DISPONIBLE POR FALTA DE FUENTE.
      - name: Resumen de estado del pipeline
        if: always()
        run: |
          {
            echo "## Resumen del pipeline — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            if [ "${{ steps.descarga.outputs.datos_nuevos }}" != "true" ]; then
              echo "- **NO HAY DATOS NUEVOS**: la SEPS todavía no publicó un mes nuevo. Pipeline terminado sin cambios."
            else
              if [ "${{ job.status }}" == "failure" ]; then
                echo "- **ERROR CRÍTICO**: un paso obligatorio del pipeline (balance/PyG/CAMEL/validación) falló. Ver logs del job — el run queda en FAILED."
              else
                echo "- Balance/PyG/CAMEL/agregados/validación: OK."
              fi
              if [ "${{ steps.solvencia.outcome }}" == "failure" ]; then
                echo "- **WARNING**: Solvencia Oficial (FS01) falló o no tenía datos nuevos de Patrimonio Técnico este mes — componente opcional, no bloquea el pipeline. Ver el paso 'Procesar Solvencia Oficial (FS01)' arriba."
              elif [ "${{ steps.solvencia.outcome }}" == "success" ]; then
                echo "- Solvencia Oficial (FS01): OK."
              fi
              if [ "${{ steps.entidades.outcome }}" == "failure" ]; then
                echo "- **WARNING**: Generación de tabla de identidad de entidades falló — componente opcional, no bloquea el pipeline."
              elif [ "${{ steps.entidades.outcome }}" == "success" ]; then
                echo "- Tabla de identidad de entidades: OK."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 7. Verificar tamaño de parquet (alerta si se acerca al límite de 100 MB)
      - name: Verificar tamaño de archivos
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: |
          echo "=== Tamaño de archivos generados ==="
          ls -lh master_data/*.parquet master_data/metadata*.json 2>/dev/null || true
          # Alerta si balance.parquet supera 95 MB
          SIZE=$(stat -c%s master_data/balance.parquet 2>/dev/null || echo 0)
          LIMIT=$((95 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::warning::balance.parquet supera 95 MB ($((SIZE / 1024 / 1024)) MB). Considerar compresión adicional."
          fi

      # 8. Configurar git y hacer commit + push
      - name: Configurar git
        if: steps.descarga.outputs.datos_nuevos == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit y push de datos actualizados
        if: steps.descarga.outputs.datos_nuevos == 'true' && (github.event_name == 'schedule' || github.event.inputs.publicar == 'true')
        run: |
          # Verificar si hay cambios
          git add \
            master_data/balance.parquet \
            master_data/pyg.parquet \
            master_data/indicadores.parquet \
            master_data/agg_*.parquet \
            master_data/metadata*.json \
            master_data/dim_segmento_historico.parquet \
            master_data/entidades_trimestral.parquet
          git add master_data/dim_segmento_historico_cambios.json 2>/dev/null || true

          # Solvencia FS01 y tabla de identidad son best-effort (paso previo
          # puede no haber generado el archivo, p. ej. sin ZIP nuevo de
          # Patrimonio Técnico) — no deben tumbar el commit si faltan.
          git add master_data/solvencia.parquet master_data/entidades_cooperativas.parquet 2>/dev/null || true
          git add master_data/panel_vulnerabilidad.parquet master_data/equivalencias_nombres.csv reports/vulnerabilidad docs/cierre/validacion_componentes.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No hay cambios en los datos. Nada que commitear."
            exit 0
          fi

          # Obtener fecha máxima de los datos desde metadata
          FECHA_MAX=$(python -c "
          import json
          with open('master_data/metadata.json') as f:
              m = json.load(f)
          print(m.get('fecha_max', 'desconocida'))
          " 2>/dev/null || echo "desconocida")

          git commit -m "Actualizar datos automáticamente a ${FECHA_MAX}

          Workflow: GitHub Actions (cron mensual)
          Fuente: Portal SEPS - Estados Financieros Mensuales"

          git push
